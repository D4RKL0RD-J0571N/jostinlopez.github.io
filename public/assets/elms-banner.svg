<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-elms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051419"/>
      <stop offset="50%" stop-color="#0a252c"/>
      <stop offset="100%" stop-color="#08333c"/>
    </linearGradient>
    <filter id="shadow-elms" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-elms)"/>

  <!-- Concentric Sonar Waves -->
  <g fill="none" stroke="#2dd4bf" stroke-opacity="0.25">
    <circle cx="400" cy="225" r="60" stroke-width="1.5"/>
    <circle cx="400" cy="225" r="110" stroke-width="1.5" stroke-dasharray="8,6"/>
    <circle cx="400" cy="225" r="160" stroke-width="2"/>
    <circle cx="400" cy="225" r="220" stroke-width="1" stroke-dasharray="4,8"/>
    <circle cx="400" cy="225" r="280" stroke-width="1"/>
  </g>

  <!-- Sonar Center Pulse -->
  <circle cx="400" cy="225" r="14" fill="#14b8a6"/>
  <circle cx="400" cy="225" r="28" fill="#2dd4bf" fill-opacity="0.2"/>

  <!-- Title Badge -->
  <rect x="50" y="35" width="280" height="32" rx="6" fill="#042f2e" fill-opacity="0.8" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="65" y="56" font-family="monospace" font-size="13" font-weight="bold" fill="#5eead4" letter-spacing="1.5">PROCEDURAL GAME SYSTEM</text>

  <text x="50" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">ELMS: Echo-Location Maze</text>
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#99f6e4">Procedural Generation, Custom HLSL ShaderLab Sonar &amp; Decoupled Mechanics</text>

  <!-- Spec cards -->
  <g filter="url(#shadow-elms)">
    <rect x="50" y="270" width="220" height="100" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="70" y="300" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5eead4">Procedural Logic</text>
    <text x="70" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">• Infinite Maze Generation</text>
    <text x="70" y="348" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">• Decoupled Systems</text>
  </g>

  <g filter="url(#shadow-elms)">
    <rect x="530" y="270" width="220" height="100" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="550" y="300" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5eead4">Custom Shaders</text>
    <text x="550" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">• HLSL Wavefront Reveal</text>
    <text x="550" y="348" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">• Real-Time Distance Field</text>
  </g>

  <!-- Footer Ribbon -->
  <rect x="50" y="390" width="700" height="35" rx="6" fill="#021c1e" stroke="#0f3c44" stroke-width="1"/>
  <text x="70" y="412" font-family="monospace" font-size="12" fill="#94a3b8">STACK: <tspan fill="#2dd4bf">C# · Unity · ShaderLab · HLSL · Procedural Algorithms · Rapid Prototyping</tspan></text>
</svg>
