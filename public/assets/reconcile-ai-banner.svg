<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#051e24"/>
    </linearGradient>
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Grid lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="32" rx="6" fill="#134e4a" fill-opacity="0.6" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="65" y="56" font-family="monospace" font-size="13" font-weight="bold" fill="#2dd4bf" letter-spacing="1.5">ENTERPRISE COPILOT</text>
  
  <text x="50" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">ReconcileAI</text>
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">3-Way Supply Chain Inventory Reconciliation &amp; Goods Receipt Auditor</text>

  <!-- Diagram Nodes -->
  <!-- Node 1: Sources -->
  <g filter="url(#shadow)">
    <rect x="50" y="180" width="180" height="80" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="75" cy="210" r="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="75" y="215" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="98" y="208" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">ERP PO 43 &amp; Ped 41</text>
    <text x="98" y="228" font-family="monospace" font-size="11" fill="#64748b">Prepack BOM (PRK)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="50" y="280" width="180" height="80" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="75" cy="310" r="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="75" y="315" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">2</text>
    <text x="98" y="308" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Physical QC Dock</text>
    <text x="98" y="328" font-family="monospace" font-size="11" fill="#64748b">SKU Curve Tallies (UN)</text>
  </g>

  <!-- Connectors -->
  <path d="M 230 220 L 310 270" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M 230 320 L 310 270" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- Node 2: Engine -->
  <g filter="url(#shadow)">
    <rect x="310" y="195" width="200" height="150" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="2"/>
    <rect x="330" y="215" width="160" height="26" rx="4" fill="#115e59"/>
    <text x="410" y="233" font-family="monospace" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle">RECONCILE ENGINE</text>
    <text x="330" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f0fdfa">• Heuristic Curve Grouping</text>
    <text x="330" y="288" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f0fdfa">• Self-Healing Excel VBA</text>
    <text x="330" y="311" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f0fdfa">• 100% Zero-Discrepancy</text>
    <text x="330" y="332" font-family="monospace" font-size="10" fill="#2dd4bf">Cols AS:AZ Fast Strips</text>
  </g>

  <!-- Connector to Output -->
  <path d="M 510 270 L 580 270" stroke="#2dd4bf" stroke-width="2.5" fill="none"/>
  <polygon points="585,270 575,264 575,276" fill="#2dd4bf"/>

  <!-- Node 3: Deliverables -->
  <g filter="url(#shadow)">
    <rect x="585" y="195" width="165" height="150" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="605" y="230" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Output Closure</text>
    <rect x="605" y="245" width="125" height="2" fill="#334155"/>
    <text x="605" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">✓ 1-Click .xlsm</text>
    <text x="605" y="295" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">✓ SAP Mov 101 Sync</text>
    <text x="605" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">✓ Portable Distro</text>
  </g>

  <!-- Footer Stats Ribbon -->
  <rect x="50" y="390" width="700" height="35" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="412" font-family="monospace" font-size="12" fill="#94a3b8">STACK: <tspan fill="#2dd4bf">Python · Streamlit · OpenPyXL · Heuristic Algorithms · Standalone Portable</tspan></text>
</svg>
