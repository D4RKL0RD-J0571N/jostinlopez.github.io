<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-unity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121626"/>
      <stop offset="100%" stop-color="#1e1838"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="node-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111424" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow-u" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-unity)"/>

  <!-- Technical grid pattern -->
  <g stroke="#2e3856" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="35" width="260" height="32" rx="6" fill="#3b0764" fill-opacity="0.6" stroke="#a855f7" stroke-width="1.5"/>
  <text x="65" y="56" font-family="monospace" font-size="13" font-weight="bold" fill="#d8b4fe" letter-spacing="1.5">SPEC-DRIVEN ARCHITECTURE</text>

  <text x="50" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">Unity Modular Core</text>
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#a5b4fc">Decoupled C# Domain, Service Locator, Event Bus &amp; Editor Tooling</text>

  <!-- Layer 1: Pure Domain -->
  <g filter="url(#shadow-u)">
    <rect x="50" y="190" width="210" height="170" rx="12" fill="url(#node-box)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="65" y="205" width="180" height="24" rx="4" fill="#312e81"/>
    <text x="155" y="222" font-family="monospace" font-size="11" font-weight="bold" fill="#c7d2fe" text-anchor="middle">PURE C# DOMAIN</text>
    <text x="70" y="255" font-family="system-ui, sans-serif" font-size="13" fill="#e0e7ff">• Zero Unity Dependencies</text>
    <text x="70" y="280" font-family="system-ui, sans-serif" font-size="13" fill="#e0e7ff">• Test-First Domain Logic</text>
    <text x="70" y="305" font-family="system-ui, sans-serif" font-size="13" fill="#e0e7ff">• Deterministic State</text>
    <text x="70" y="330" font-family="monospace" font-size="11" fill="#818cf8">NUnit 100% Isolated</text>
  </g>

  <!-- Bus Connector -->
  <g>
    <path d="M 260 275 L 330 275" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5,5"/>
    <circle cx="295" cy="275" r="5" fill="#c084fc"/>
  </g>

  <!-- Layer 2: Service & Event Bus -->
  <g filter="url(#shadow-u)">
    <rect x="330" y="190" width="180" height="170" rx="12" fill="#1e1035" stroke="#c084fc" stroke-width="2"/>
    <rect x="345" y="205" width="150" height="24" rx="4" fill="#581c87"/>
    <text x="420" y="222" font-family="monospace" font-size="11" font-weight="bold" fill="#f3e8ff" text-anchor="middle">SERVICES &amp; EVENTS</text>
    <text x="350" y="255" font-family="system-ui, sans-serif" font-size="13" fill="#f5d0fe">• Service Locator / IoC</text>
    <text x="350" y="280" font-family="system-ui, sans-serif" font-size="13" fill="#f5d0fe">• Type-Safe Event Bus</text>
    <text x="350" y="305" font-family="system-ui, sans-serif" font-size="13" fill="#f5d0fe">• No Manager Singletons</text>
    <text x="350" y="330" font-family="monospace" font-size="11" fill="#e879f9">Event Aggregator</text>
  </g>

  <!-- Connector to Engine -->
  <g>
    <path d="M 510 275 L 575 275" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5,5"/>
    <circle cx="542" cy="275" r="5" fill="#c084fc"/>
  </g>

  <!-- Layer 3: Infrastructure / Unity -->
  <g filter="url(#shadow-u)">
    <rect x="575" y="190" width="175" height="170" rx="12" fill="url(#node-box)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="590" y="205" width="145" height="24" rx="4" fill="#075985"/>
    <text x="662" y="222" font-family="monospace" font-size="11" font-weight="bold" fill="#e0f2fe" text-anchor="middle">UNITY RUNTIME</text>
    <text x="595" y="255" font-family="system-ui, sans-serif" font-size="13" fill="#bae6fd">• ScriptableObjects</text>
    <text x="595" y="280" font-family="system-ui, sans-serif" font-size="13" fill="#bae6fd">• Custom Inspectors</text>
    <text x="595" y="305" font-family="system-ui, sans-serif" font-size="13" fill="#bae6fd">• Procedural Tools</text>
    <text x="595" y="330" font-family="monospace" font-size="11" fill="#38bdf8">Unity 6 / URP</text>
  </g>

  <!-- Footer Ribbon -->
  <rect x="50" y="390" width="700" height="35" rx="6" fill="#0c0e1a" stroke="#1f253d" stroke-width="1"/>
  <text x="70" y="412" font-family="monospace" font-size="12" fill="#94a3b8">STACK: <tspan fill="#c084fc">C# · Unity 6 · ScriptableObjects · SpecKit SDD · HLSL · Custom Editor Tools</tspan></text>
</svg>
